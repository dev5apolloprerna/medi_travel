<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi Travel - Fit-to-Fly Medical Sign-Off Form</title>

    <style>
        @page {
            size: A4;
            margin: 13mm 15mm 13mm 15mm;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            color: #33415a;
        }

        .page {
            width: 100%;
        }

        .main-table,
        .profile-table,
        .checklist-table,
        .signature-table {
            width: 100%;
            border-collapse: collapse;
        }

        .brand {
            padding: 0 0 10px 0;
            font-size: 32px;
            line-height: 1.05;
            font-weight: bold;
            letter-spacing: 5px;
            color: #24469a;
        }

        .document-title {
            padding: 6px 0 16px 0;
            font-size: 20px;
            line-height: 1.25;
            font-weight: bold;
            color: #182033;
        }

        .top-rule {
            width: 100%;
            height: 12px;
            margin: 0 0 18px 0;
            border-bottom: 3px solid #1787c8;
        }

        .profile-table {
            margin-bottom: 16px;
            table-layout: fixed;
        }

        .profile-table td {
            border: 1px solid #c7d2df;
            padding: 9px 10px;
            vertical-align: middle;
            line-height: 1.4;
        }

        .profile-label {
            background: #f4f6f9;
            font-weight: bold;
            color: #354258;
            font-size: 14px;
        }

        .profile-value {
            background: #ffffff;
        }

        .field-input {
            display: block;
            width: 100%;
            height: 28px;
            margin: 0;
            padding: 2px 4px;

            border: none;
            border-bottom: 1px solid #66758a;

            outline: none;
            background: transparent;

            color: #182033;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .checklist-table {
            margin-bottom: 32px;
        }

        .checklist-table td {
            padding: 7px 0;
            vertical-align: top;
            line-height: 1.5;
        }

        .check-cell {
            width: 30px;
            padding-top: 7px !important;
        }

        .check-input {
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            vertical-align: middle;
            cursor: pointer;
        }

        .check-label {
            cursor: pointer;
            color: #26334a;
            font-size: 14px;
            line-height: 1.5;
        }

        .signature-table {
            table-layout: fixed;
            margin-top: 34px;
        }

        .signature-table td {
            border: none;
            padding: 0;
            vertical-align: bottom;
        }

        .signature-left {
            width: 57%;
            padding-right: 24px !important;
        }

        .signature-right {
            width: 43%;
        }

        .signature-input {
            display: block;
            width: 100%;
            height: 32px;
            margin: 0;
            padding: 2px 4px;

            border: none;
            border-bottom: 1px solid #56657a;

            outline: none;
            background: transparent;

            color: #182033;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .field-caption {
            padding-top: 5px;
            color: #26334a;
            font-size: 14px;
            line-height: 1.4;
        }

        .avoid-break {
            page-break-inside: avoid;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<form action="" method="post" id="fitToFlyMedicalSignOffForm">

    <div class="page">

        <table class="main-table">
            <tr>
                <td>

                    <div class="brand">
                        MEDITRAVEL
                    </div>

                    <div class="document-title">
                        FIT-TO-FLY MEDICAL SIGN-OFF FORM
                    </div>

                    <div class="top-rule"></div>

                    <!-- PATIENT DETAILS -->
                    <table class="profile-table">

                        <colgroup>
                            <col style="width:25%;">
                            <col style="width:25%;">
                            <col style="width:25%;">
                            <col style="width:25%;">
                        </colgroup>

                        <tr>

                            <td class="profile-label">
                                Patient Full Name
                            </td>

                            <td class="profile-value">
                                <input
                                    type="text"
                                    id="patient_name"
                                    name="patient_name"
                                    class="field-input"
                                >
                            </td>

                            <td class="profile-label">
                                Passport Number
                            </td>

                            <td class="profile-value">
                                <input
                                    type="text"
                                    id="input2"
                                    name="input2"
                                    class="field-input"
                                >
                            </td>

                        </tr>

                    </table>


                    <!-- MEDICAL FITNESS CHECKLIST -->
                    <table class="checklist-table">

                        <tr>

                            <td class="check-cell">

                                <input
                                    type="checkbox"
                                    id="input3"
                                    name="input3"
                                    value="1"
                                    class="check-input"
                                >

                            </td>

                            <td>

                                <label
                                    for="input3"
                                    class="check-label"
                                >
                                    The surgical incision site(s) are closed, healing stably...
                                </label>

                            </td>

                        </tr>


                        <tr>

                            <td class="check-cell">

                                <input
                                    type="checkbox"
                                    id="input4"
                                    name="input4"
                                    value="1"
                                    class="check-input"
                                >

                            </td>

                            <td>

                                <label
                                    for="input4"
                                    class="check-label"
                                >
                                    The patient's cardiopulmonary status is stable...
                                </label>

                            </td>

                        </tr>

                    </table>


                    <!-- PHYSICIAN SIGN-OFF -->
                    <div class="avoid-break">

                        <table class="signature-table">

                            <tr>

                                <td class="signature-left">

                                    <input
                                        type="text"
                                        id="input5"
                                        name="input5"
                                        class="signature-input"
                                    >

                                    <div class="field-caption">
                                        Signature of Attending Physician
                                    </div>

                                </td>


                                <td class="signature-right">

                                    <input
                                        type="text"
                                        id="input6"
                                        name="input6"
                                        class="signature-input"
                                    >

                                    <div class="field-caption">
                                        License Number
                                    </div>

                                </td>

                            </tr>

                        </table>

                    </div>


                </td>
            </tr>
        </table>

    </div>

</form>

</body>
</html>
