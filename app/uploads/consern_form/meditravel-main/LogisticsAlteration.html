<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medi Travel - Logistics Alteration & Incident Report Form</title>

    <style>
        @page {
            size: A4;
            margin: 13mm 15mm 13mm 15mm;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            color: #33415a;
        }

        .page {
            width: 100%;
        }

        .main-table,
        .profile-table,
        .section-heading,
        .signature-table {
            width: 100%;
            border-collapse: collapse;
        }

        .brand {
            padding: 0 0 10px 0;
            font-size: 32px;
            line-height: 1.05;
            font-weight: bold;
            letter-spacing: 5px;
            color: #24469a;
        }

        .document-title {
            padding: 6px 0 16px 0;
            font-size: 20px;
            line-height: 1.25;
            font-weight: bold;
            color: #182033;
        }

        .top-rule {
            width: 100%;
            height: 12px;
            margin: 0 0 18px 0;
            border-bottom: 3px solid #1787c8;
        }

        .profile-table {
            margin-bottom: 18px;
            table-layout: fixed;
        }

        .profile-table td {
            border: 1px solid #c7d2df;
            padding: 9px 10px;
            vertical-align: middle;
            line-height: 1.4;
        }

        .profile-label {
            background: #f4f6f9;
            font-weight: bold;
            color: #354258;
            font-size: 14px;
        }

        .profile-value {
            background: #ffffff;
        }

        .field-input {
            display: block;
            width: 100%;
            height: 28px;
            margin: 0;
            padding: 2px 4px;

            border: none;
            border-bottom: 1px solid #66758a;

            outline: none;
            background: transparent;

            color: #182033;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .section-heading {
            margin: 10px 0 10px 0;
        }

        .section-heading td {
            padding: 5px 0 8px 0;

            border-bottom: 1px solid #cbd7e5;

            color: #24469a;

            font-size: 17px;
            line-height: 1.25;
            font-weight: bold;

            letter-spacing: .1px;
        }

        .incident-box {
            width: 100%;
            height: 130px;

            margin: 0 0 34px 0;
            padding: 8px 10px;

            border: 1px solid #c7d2df;

            outline: none;
            resize: none;

            background: #ffffff;

            color: #182033;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            line-height: 1.5;
        }

        .signature-table {
            table-layout: fixed;
            margin-top: 20px;
        }

        .signature-table td {
            border: none;
            padding: 0;
            vertical-align: bottom;
        }

        .signature-line-cell {
            width: 100%;
            padding: 0 12px !important;
        }

        .signature-input {
            display: block;

            width: 100%;
            height: 32px;

            margin: 0;
            padding: 2px 4px;

            border: none;
            border-bottom: 1px solid #56657a;

            outline: none;
            background: transparent;

            color: #182033;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .field-caption {
            padding-top: 5px;

            color: #26334a;

            font-size: 14px;
            line-height: 1.4;
        }

        .avoid-break {
            page-break-inside: avoid;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                font-size: 14px;
            }
        }
    </style>

</head>

<body>

<form
    action=""
    method="post"
    id="logisticsAlterationIncidentForm"
>

    <div class="page">

        <table class="main-table">

            <tr>

                <td>

                    <!-- =========================
                         BRAND
                    ========================== -->

                    <div class="brand">
                        MEDITRAVEL
                    </div>


                    <!-- =========================
                         TITLE
                    ========================== -->

                    <div class="document-title">
                        LOGISTICS ALTERATION &amp; INCIDENT REPORT FORM
                    </div>


                    <!-- =========================
                         BLUE LINE
                    ========================== -->

                    <div class="top-rule"></div>


                    <!-- =========================
                         PATIENT / CASE DETAILS
                    ========================== -->

                    <table class="profile-table">

                        <colgroup>

                            <col style="width:25%;">

                            <col style="width:25%;">

                            <col style="width:25%;">

                            <col style="width:25%;">

                        </colgroup>


                        <tr>

                            <!-- Patient Name -->

                            <td class="profile-label">
                                Patient Full Name
                            </td>


                            <td class="profile-value">

                                <input
                                    type="text"
                                    id="input1"
                                    name="input1"
                                    class="field-input"
                                >

                            </td>


                            <!-- Case Reference -->

                            <td class="profile-label">
                                Case Reference ID
                            </td>


                            <td class="profile-value">

                                <input
                                    type="text"
                                    id="input2"
                                    name="input2"
                                    class="field-input"
                                >

                            </td>

                        </tr>

                    </table>


                    <!-- =========================
                         SECTION 2
                    ========================== -->

                    <table class="section-heading">

                        <tr>

                            <td>
                                2. DETAILED DESCRIPTION OF LOGISTICS ALTERATION / INCIDENT
                            </td>

                        </tr>

                    </table>


                    <!-- =========================
                         INCIDENT TEXTAREA
                    ========================== -->

                    <textarea
                        id="input3"
                        name="input3"
                        class="incident-box"
                    ></textarea>


                    <!-- =========================
                         SIGNATURE
                    ========================== -->

                    <div class="avoid-break">

                        <table class="signature-table">

                            <tr>

                                <td class="signature-line-cell">


                                    <input
                                        type="text"
                                        id="input4"
                                        name="input4"
                                        class="signature-input"
                                    >


                                    <div class="field-caption">

                                        Signature of Reporting Representative

                                    </div>


                                </td>

                            </tr>

                        </table>

                    </div>


                </td>

            </tr>

        </table>

    </div>

</form>

</body>
</html>
